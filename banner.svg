<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <text x="640" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#f8fafc">/transfer</text>
  <text x="640" y="96" text-anchor="middle" font-size="18" fill="#94a3b8">move a live Claude Code task to an always-on machine — same session, same path</text>

  <!-- laptop -->
  <g transform="translate(90,140)">
    <rect width="330" height="190" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="18" y="18" width="294" height="112" rx="10" fill="#0b1220" stroke="#1f2937"/>
    <text x="34" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f97316">❯ /transfer</text>
    <text x="34" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748b">  abort · write handoff</text>
    <text x="34" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748b">  ship · launch · report</text>
    <text x="165" y="166" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">laptop (about to sleep)</text>
  </g>

  <!-- payload arrow -->
  <path d="M440,235 C560,175 720,175 840,235" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" marker-end="url(#head)"/>
  <g font-size="15" fill="#cbd5e1" text-anchor="middle">
    <text x="640" y="160">rsync: project (with .git and uncommitted work)</text>
    <text x="640" y="268">+ transcript &lt;id&gt;.jsonl · subagents · memory/</text>
    <text x="640" y="292" fill="#64748b">node_modules / .venv / caches skipped</text>
  </g>

  <!-- mini -->
  <g transform="translate(860,140)">
    <rect width="330" height="190" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="18" y="18" width="294" height="112" rx="10" fill="#0b1220" stroke="#1f2937"/>
    <text x="34" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a855f7">tmux · caffeinate -ims</text>
    <text x="34" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e2e8f0">claude --resume &lt;id&gt;</text>
    <text x="34" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748b">  --model · --effort</text>
    <text x="165" y="166" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">always-on host (ssh)</text>
  </g>

  <text x="640" y="370" text-anchor="middle" font-size="15" fill="#64748b">resume mode keeps the session id · copy mode falls back to a fresh session seeded with the handoff</text>
</svg>
